<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hypertension Management Quiz — Hypertension Conference</title>
<style>
  :root{
    --brand:#d32f2f;
    --brand-dark:#b71c1c;
    --brand-light:#ffebee;
    --bg1:#d32f2f;
    --bg2:#ef5350;

    --correct:#2e7d32;
    --correct-bg:#e8f5e9;
    --wrong:#d64545;
    --wrong-bg:#fdeaea;

    --ink:#4a0d0d;
    --muted:#7a4a4a;
}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink); min-height:100%; display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  .app{
    width:100%; max-width:640px; background:#fff; border-radius:26px;
    box-shadow:0 24px 60px rgba(0,0,0,.28); overflow:hidden; display:flex; flex-direction:column;
  }
header{
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    color:#fff;
    padding:22px 26px;
}

  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:700;}
  header h1{margin:6px 0 0;font-size:22px;line-height:1.25;}
  .bar{height:6px;background:rgba(255,255,255,.25);}
  .bar > span{display:block;height:100%;width:0;background:#fff;transition:width .4s ease;}
  .stage{padding:26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;}

  /* Start screen */
  .start p{font-size:16px;line-height:1.6;color:var(--muted);margin:0 0 22px;}
  .start .meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;}
  .chip{background:var(--brand-light);color:var(--brand-dark);font-weight:700;font-size:14px;
    padding:9px 15px;border-radius:999px;}
  .btn{
    appearance:none;border:0;cursor:pointer;font-weight:800;font-size:18px;
    padding:18px 22px;border-radius:16px;background:var(--brand);color:#fff;width:100%;
    transition:transform .08s ease,filter .15s ease;
  }
  .btn:active{transform:scale(.98);filter:brightness(1.05);}
  .btn.secondary{background:#eef3f1;color:var(--brand-dark);}

  .qcount{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px;}
  .qtext{font-size:21px;font-weight:800;line-height:1.4;margin:0 0 20px;}
  .options{display:flex;flex-direction:column;gap:12px;}
  .opt{
    text-align:left;border:2px solid #e3ece9;background:#fff;border-radius:16px;
    padding:17px 18px;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;gap:13px;transition:border-color .15s,background .15s,transform .08s;
  }
  .opt:active{transform:scale(.99);}
  .opt .let{
    flex:0 0 32px;height:32px;border-radius:9px;background:var(--brand-light);color:var(--brand-dark);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  }
  .opt.correct{border-color:var(--correct);background:var(--correct-bg);}
  .opt.correct .let{background:var(--correct);color:#fff;}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .opt.wrong .let{background:var(--wrong);color:#fff;}
  .opt.disabled{pointer-events:none;opacity:.75;}
  .opt.correct.disabled,.opt.wrong.disabled{opacity:1;}

  .explain{
    margin-top:18px;border-radius:16px;padding:16px 18px;font-size:15.5px;line-height:1.55;
    background:#f4f8f7;border-left:5px solid var(--brand);display:none;
  }
  .explain.show{display:block;animation:fade .3s ease;}
  .explain .verdict{font-weight:800;margin-bottom:5px;display:block;}
  .explain .verdict.ok{color:var(--correct);}
  .explain .verdict.no{color:var(--wrong);}
  .explain .ref{margin-top:9px;font-size:13px;color:var(--muted);font-style:italic;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .foot{margin-top:20px;}

  /* Result */
  .result{text-align:center;}
  .score-ring{font-size:52px;font-weight:900;color:var(--brand-dark);margin:6px 0;}
  .result .sub{font-size:17px;color:var(--muted);margin-bottom:8px;}
  .verdict-line{font-size:19px;font-weight:800;margin:14px 0 24px;}
  .hide{display:none!important;}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="kicker" style="text-align:center;">
    REGENIX DRUGS LTD.
  </div>

  <h1 style="text-align:center;">
    Clinical Knowledge Challenge 2026
  </h1>
</header>

<div class="bar">
    <span id="bar"></span>
</div>

<div class="stage" id="stage"></div>

<script>
const QUIZ = {
 intro:"",
chips:[],
questions: [
{
q:"A 46-year-old man has an office blood pressure of 148/92 mmHg during a routine health check. What is the most appropriate next step to confirm the diagnosis of hypertension?",
options:[
"Start antihypertensive therapy immediately",
"Repeat the BP after 5 minutes and diagnose hypertension if still elevated",
"Confirm using 24-hour ambulatory BP monitoring (ABPM) or validated home BP monitoring (HBPM)",
"Measure BP only in the opposite arm"
],
answer:2,
why:"A diagnosis of hypertension should not be based on a single office BP reading. ABPM is the reference standard, while HBPM is an acceptable alternative. These methods help identify white-coat and masked hypertension, reducing misdiagnosis.",
ref:"2023 European Society of Hypertension (ESH) Guideline | 2017 ACC/AHA Hypertension Guideline"
},

{
q:"A 60-year-old man with type 2 diabetes and albuminuria has a BP of 154/94 mmHg. Which antihypertensive drug class should be preferred?",
options:[
"Beta-blocker",
"ACE inhibitor or ARB",
"Alpha-blocker",
"Verapamil"
],
answer:1,
why:"ACE inhibitors and ARBs reduce albuminuria, slow CKD progression, and reduce cardiovascular events. They are the preferred first-line therapy in patients with diabetes and albuminuria unless contraindicated.",
ref:"KDIGO 2024 CKD Guideline | ADA Standards of Care 2025 | 2023 ESH Guideline"
},

{
q:"A patient remains hypertensive (164/98 mmHg) despite optimal doses of an ACE inhibitor, a calcium channel blocker, and a thiazide-like diuretic. Adherence has been confirmed. What is the preferred fourth-line agent?",
options:[
"Clonidine",
"Hydralazine",
"Spironolactone",
"Doxazosin"
],
answer:2,
why:"This patient has resistant hypertension. The PATHWAY-2 trial demonstrated that spironolactone is the most effective fourth-line therapy for resistant hypertension, provided renal function and potassium levels are acceptable.",
ref:"PATHWAY-2 Trial (Lancet 2015) | 2023 European Society of Hypertension Guideline"
},

{
q:"A 68-year-old man presents with BP 228/130 mmHg, confusion, papilledema, and acute kidney injury. What is the recommended initial BP management?",
options:[
"Lower BP to below 140/90 mmHg within 1 hour",
"Lower mean arterial pressure by 20–25% during the first hour using intravenous antihypertensive therapy",
"Administer sublingual nifedipine immediately",
"Observe for 24 hours before initiating treatment"
],
answer:1,
why:"This is a hypertensive emergency with acute target-organ damage. BP should be lowered gradually, generally by 20–25% of the mean arterial pressure during the first hour to avoid compromising cerebral, coronary and renal perfusion.",
ref:"2023 European Society of Hypertension (ESH) Guideline | AHA Scientific Statement on Hypertensive Crisis"
},

{
q:"A 58-year-old man has a clinic blood pressure of 146/92 mmHg, but his 24-hour ambulatory blood pressure average is 128/78 mmHg. What is the most likely diagnosis?",
options:[
"Sustained hypertension",
"White-coat hypertension",
"Masked hypertension",
"Resistant hypertension"
],
answer:1,
why:"White-coat hypertension is characterised by elevated office blood pressure with normal out-of-office blood pressure (ABPM or HBPM). Confirming this diagnosis helps avoid unnecessary lifelong antihypertensive treatment while ensuring continued follow-up, as these patients remain at increased cardiovascular risk than normotensive individuals.",
ref:"2023 European Society of Hypertension (ESH) Guideline | 2017 ACC/AHA Hypertension Guideline"
}
]
};
</script>

<script>
const stage=document.getElementById('stage');
const bar=document.getElementById('bar');
let idx=0, score=0, answered=false;

function setBar(p){bar.style.width=p+'%';}
function renderStart(){
    setBar(0);

    stage.innerHTML = `
<div class="start">

  <p style="text-align:center;font-size:17px;line-height:1.7;color:var(--muted);margin-top:10px;">
    Welcome to the <strong>Clinical Knowledge Challenge 2026</strong>.<br><br>

    Test your clinical decision-making through <strong>five evidence-based hypertension case scenarios</strong> developed from internationally recognised guidelines.<br><br>

    Each question includes a concise scientific explanation to reinforce evidence-based learning.<br><br>

    <strong>Complete all five questions to qualify for the Lucky Draw.</strong>
  </p>

  <button class="btn" id="startBtn">
    🚀 START CLINICAL CHALLENGE
  </button>

</div>`;

    document.getElementById("startBtn").onclick = () => {
        idx = 0;
        score = 0;
        renderQ();
    };
}

function renderQ(){
  answered=false;
  const item=QUIZ.questions[idx];
  setBar(Math.round((idx)/QUIZ.questions.length*100));
  const opts=item.options.map((o,i)=>`
    <button class="opt" data-i="${i}">
      <span class="let">${String.fromCharCode(65+i)}</span><span>${o}</span>
    </button>`).join('');
  stage.innerHTML=`
    <div class="qwrap">
      <div class="qcount">Question ${idx+1} of ${QUIZ.questions.length} · Score ${score}</div>
      <p class="qtext">${item.q}</p>
      <div class="options">${opts}</div>
      <div class="explain" id="explain"></div>
      <div class="foot hide" id="foot">
        <button class="btn" id="nextBtn">${idx===QUIZ.questions.length-1?'See my result':'Next question'}</button>
      </div>
    </div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(parseInt(b.dataset.i)));
}

function choose(i){
  if(answered)return; answered=true;
  const item=QUIZ.questions[idx];
  const opts=stage.querySelectorAll('.opt');
  opts.forEach(o=>o.classList.add('disabled'));
  const correct=item.answer;
  opts[correct].classList.add('correct');
  const ok=i===correct;
  if(ok){score++;}
  else{opts[i].classList.add('wrong');}
  const ex=document.getElementById('explain');
  ex.innerHTML=`
    <span class="verdict ${ok?'ok':'no'}">${ok?'✓ Correct':'✗ Not quite'}</span>
    ${item.why}
    <div class="ref">Reference: ${item.ref}</div>`;
  ex.classList.add('show');
  const foot=document.getElementById('foot');
  foot.classList.remove('hide');
  document.getElementById('nextBtn').onclick=()=>{
    idx++;
    if(idx<QUIZ.questions.length){renderQ();}else{renderResult();}
  };
}

function renderResult(){

  setBar(100);

  const total = QUIZ.questions.length;

  const pct = Math.round(score/total*100);

  fetch("https://script.google.com/macros/s/AKfycbwZKW9BSPzyy8mXbURd9yXD8gH-S-UReWDXI4SGIWiEkRD_3wt7fUmrxs6cvde6DLz8/exec", {
    method:"POST",
    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify({
      name:localStorage.getItem("doctorName"),
      mobile:localStorage.getItem("doctorMobile"),
      email:localStorage.getItem("doctorEmail"),
      hospital:localStorage.getItem("doctorHospital"),
      city:localStorage.getItem("doctorCity"),
      specialty:"Hypertension",
      score:score
    })
  });
  let line;
  if(pct===100) line="Outstanding — a perfect score!";
  else if(pct>=80) line="Excellent work.";
  else if(pct>=60) line="Solid — a good grasp of the essentials.";
  else if(pct>=40) line="Not bad — worth a quick refresher.";
  else line="A good chance to brush up.";
  stage.innerHTML=`
    <div class="result">
  <div class="sub">You scored</div>
  <div class="score-ring">${score} / ${total}</div>
  <div class="sub">${pct}%</div>
  <div class="verdict-line">${line}</div>

  <h2>🎉 Thank You!</h2>

  <p>
    Your participation has been successfully recorded.<br><br>
    <strong>You have been entered into the Lucky Draw.</strong><br>
    Winners will be announced end of conference.
    <br><br>
    🍀 Best of Luck!
  </p>
</div>`;

}

renderStart();
</script>

</div>

</body>
</html>
